name: Benchmark
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [ '1.25' ]
    name: "Benchmark [ Go ${{ matrix.go }} ]"
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Cache Go modules
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install Go stable version
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: Install benchstat
        env:
          GOTOOLCHAIN: auto
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
      - name: Benchmark (comparison)
        run: |
          cd bench/comparison && go test -bench . -benchmem -count 5 -timeout 60m | tee stdlib.txt && go test -bench . -benchmem -count 5 -timeout 60m -tags jwx_goccy | tee goccy.txt
      - name: Benchmark (performance)
        run: |
          cd bench/performance && make stdlib && make goccy && make benchstat
