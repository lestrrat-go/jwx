name: CI
on:
  pull_request:
    branches:
      - v*
      - develop/*
  push:
    branches:
      - v*
      - develop/*

jobs:
  build:
    runs-on: ubuntu-latest
    name: "Test"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install Go stable version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          check-latest: true
      # Mirror of the guard in the Go 1.27 job below. go.mod declares go 1.26.0,
      # where encoding/json/v2 is still behind GOEXPERIMENT=jsonv2, so this job
      # must name the experiment. Asserting both halves means neither the probe
      # in the Makefile nor a toolchain change can quietly flip one of them.
      # When go.mod moves to 1.27, this expectation becomes the empty string.
      - name: Verify the jsonv2 experiment is set
        run: |
          exp=$(make print-goexperiment)
          if [ "$exp" != "jsonv2" ]; then
            echo "::error::expected GOEXPERIMENT=jsonv2 on the go.mod toolchain, got '$exp'"
            exit 1
          fi
      - name: Install stringer
        run: go install golang.org/x/tools/cmd/stringer@v0.42.0
      - name: Install jose
        run: sudo apt-get install -y --no-install-recommends jose
      - run: make generate
      - name: make tidy
        run: make tidy
      - name: Test with coverage
        run: make cover
      - name: Coverage report
        if: always()
        run: |
          if [ -f coverage.out ]; then
            {
              echo "## Coverage"
              echo
              echo '| Package | Coverage | Covered/Total |'
              echo '|---------|---------:|--------------:|'
              awk '
                NR == 1 { next }
                {
                  key = $1
                  if (!(key in stmts)) {
                    stmts[key] = $2
                    n = index($1, ".go:")
                    pkg = substr($1, 1, n + 1)
                    sub(/\/[^\/]+$/, "", pkg)
                    sub(/^github\.com\/lestrrat-go\/jwx\/v[0-9]+\/?/, "", pkg)
                    if (pkg == "") pkg = "(root)"
                    pkgof[key] = pkg
                  }
                  if ($3 > 0) hit[key] = 1
                }
                END {
                  for (k in stmts) {
                    p = pkgof[k]
                    total[p] += stmts[k]
                    gt += stmts[k]
                    if (k in hit) {
                      covered[p] += stmts[k]
                      gc += stmts[k]
                    }
                  }
                  n = 0
                  for (p in total) keys[++n] = p
                  for (i = 1; i <= n; i++)
                    for (j = i + 1; j <= n; j++)
                      if (keys[j] < keys[i]) { t = keys[i]; keys[i] = keys[j]; keys[j] = t }
                  for (i = 1; i <= n; i++) {
                    p = keys[i]
                    printf "| %s | %.1f%% | %d/%d |\n", p, 100 * covered[p] / total[p], covered[p], total[p]
                  }
                  if (gt > 0) printf "| **TOTAL** | **%.1f%%** | **%d/%d** |\n", 100 * gc / gt, gc, gt
                }
              ' coverage.out
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check difference between generation code and commit code
        run: make check_diffs

  # Guards the Go 1.27 compatibility shim in internal/json. Nothing else in CI
  # compiles skipfunc_go127.go, because every other workflow takes its toolchain
  # from go.mod (the 1.26 line).
  #
  # This is a separate job rather than a go-version matrix on "build" above,
  # because the two toolchains do not run the same steps. `make generate`,
  # `make tidy`, `make check_diffs` and the coverage report each need exactly
  # one toolchain and produce nothing useful on a second, and `-vet=off` below
  # must not apply to the go.mod toolchain. A matrix would need `if:` guards on
  # most of the steps, and it would force `build` to hardcode a Go version
  # instead of reading go.mod, so CI would no longer test what go.mod declares.
  # Once go.mod moves to 1.27 the shim and `-vet=off` both go away, the two
  # jobs become identical, and a matrix becomes the better shape.
  build-next:
    runs-on: ubuntu-latest
    name: "Test (Go 1.27)"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go1.27-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go1.27-
      - name: Install Go 1.27
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
      - name: Install jose
        run: sudo apt-get install -y --no-install-recommends jose
      # Mirror of the guard in the "build" job above. Go 1.27 ships
      # encoding/json/v2 in the standard library, so this job must NOT name the
      # jsonv2 experiment; doing so rebuilds the standard library under a
      # non-default configuration. The Makefile probes the toolchain to decide,
      # and this step guards that probe against regressing.
      - name: Verify the jsonv2 experiment is not set
        run: |
          exp=$(make print-goexperiment)
          if [ -n "$exp" ]; then
            echo "::error::expected an empty GOEXPERIMENT on Go 1.27, got '$exp'"
            exit 1
          fi
          # The probe must also drop a jsonv2 the caller already exported. A
          # developer who set it for Go 1.26 keeps it in their environment
          # across the toolchain upgrade, and it would otherwise survive here.
          exp=$(GOEXPERIMENT=jsonv2 make print-goexperiment)
          if [ -n "$exp" ]; then
            echo "::error::expected the probe to drop an inherited jsonv2 on Go 1.27, got '$exp'"
            exit 1
          fi
      # -vet=off is required, not a shortcut. go.mod declares go 1.26.0, and
      # under Go 1.27 the encoding/json/v2 and jsontext symbols carry a
      # since-go1.27 API version, so vet's stdversion analyzer rejects every
      # file that uses them ("requires go1.27 or later (file is go1.26)").
      # The Go 1.26 job above runs the full vet suite. Drop this flag when
      # go.mod moves to 1.27.
      - name: Test
        run: make test-cmd TESTOPTS=-vet=off
