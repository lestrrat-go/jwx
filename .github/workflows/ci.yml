name: CI
on:
  pull_request:
    branches:
      - v*
      - develop/*

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go_tags: [ 'stdlib', 'goccy', 'es256k', 'secp256k1-pem', 'asmbase64', 'alltags']
        go: [ '1.24', '1.23' ]
    name: "Test [ Go ${{ matrix.go }} / Tags ${{ matrix.go_tags }} ]"
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Cache Go modules
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/bazel
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install Go stable version
        uses: actions/setup-go@a5f9b05d2d216f63e13859e0d847461041025775 # v6.1.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: Install stringer
        run: go install golang.org/x/tools/cmd/stringer@v0.35.0
      - name: Install tparse
        run: go install github.com/mfridman/tparse@v0.12.2
      - name: Install jose
        run: sudo apt-get install -y --no-install-recommends jose
      - run: make generate
      - name: make tidy
        run: make tidy
      - name: Test with coverage
        run: make cover-${{ matrix.go_tags }}
      - uses: bazelbuild/setup-bazelisk@v3
      - run: bazel run //:gazelle-update-repos
      - name: Check difference between generation code and commit code
        run: make check_diffs
