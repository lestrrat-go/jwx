name: CI
on:
  pull_request:
    branches:
      - v*
      - develop/*

jobs:
  build:
    runs-on: ubuntu-latest
    name: "Test"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Cache Go modules
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install Go stable version
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
          check-latest: true
      - name: Install stringer
        run: go install golang.org/x/tools/cmd/stringer@v0.42.0
      - name: Install jose
        run: sudo apt-get install -y --no-install-recommends jose
      - run: make generate
      - name: make tidy
        run: make tidy
      - name: Test with coverage
        run: make cover
      - name: Coverage report
        if: always()
        run: |
          if [ -f coverage.out ]; then
            {
              echo "## Coverage"
              echo
              echo '| Package | Coverage | Covered/Total |'
              echo '|---------|---------:|--------------:|'
              awk '
                NR == 1 { next }
                {
                  n = index($1, ".go:")
                  pkg = substr($1, 1, n + 1)
                  sub(/\/[^\/]+$/, "", pkg)
                  sub(/^github\.com\/lestrrat-go\/jwx\/v[0-9]+\/?/, "", pkg)
                  if (pkg == "") pkg = "(root)"
                  total[pkg] += $2
                  if ($3 > 0) covered[pkg] += $2
                  gt += $2
                  if ($3 > 0) gc += $2
                }
                END {
                  n = 0
                  for (p in total) keys[++n] = p
                  for (i = 1; i <= n; i++)
                    for (j = i + 1; j <= n; j++)
                      if (keys[j] < keys[i]) { t = keys[i]; keys[i] = keys[j]; keys[j] = t }
                  for (i = 1; i <= n; i++) {
                    p = keys[i]
                    printf "| %s | %.1f%% | %d/%d |\n", p, 100 * covered[p] / total[p], covered[p], total[p]
                  }
                  if (gt > 0) printf "| **TOTAL** | **%.1f%%** | **%d/%d** |\n", 100 * gc / gt, gc, gt
                }
              ' coverage.out
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check difference between generation code and commit code
        run: make check_diffs
