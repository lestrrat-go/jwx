package: jwe
generator_comment: "tools/cmd/genheaders/main.go"
output_file: headers_gen.go
description: "JWE Header"
rfc: "RFC7516"
content_noun: "encrypted content"
store_raw_on_unmarshal: false

header_comment: |
  Headers describe a standard JWE Header set. It is part of the JWE message
  and is used to represent both Protected and Unprotected headers,
  which in turn can be found in each Recipient object.
  If you are not sure how this works, it is strongly recommended that
  you read RFC7516, especially the section
  that describes the full JSON serialization format of JWE messages.

  In most cases, you likely want to use the protected headers, as this is the part of the encrypted content

post_field_interface_methods:
  - "Encode() ([]byte, error)"
  - "Decode([]byte) error"
  - "Clone() (Headers, error)"
  - "Copy(Headers) error"
  - "Merge(Headers) (Headers, error)"

keys_comment: "// Keys returns a list of the keys contained in this header."

zero_vals:
  jwa.KeyEncryptionAlgorithm: "jwa.EmptyKeyEncryptionAlgorithm()"
  jwa.CompressionAlgorithm: "jwa.NoCompress()"
  jwa.ContentEncryptionAlgorithm: "jwa.EmptyContentEncryptionAlgorithm()"

fields:
  - name: agreementPartyUInfo
    type: "[]byte"
    json: apu
  - name: agreementPartyVInfo
    type: "[]byte"
    json: apv
  - name: algorithm
    type: jwa.KeyEncryptionAlgorithm
    json: alg
  - name: compression
    type: jwa.CompressionAlgorithm
    json: zip
  - name: contentEncryption
    type: jwa.ContentEncryptionAlgorithm
    json: enc
    reject_empty: true
  - name: contentType
    json: cty
  - name: encapsulatedKey
    type: "[]byte"
    json: ek
  - name: critical
    type: "[]string"
    json: crit
    # A null "crit" is rejected while decoding, in every header location
    # and regardless of jwe.WithStrictHeaderRules.
    #
    # RFC 7515 §4.1.11 (adopted for JWE by RFC 7516 §4.1.13) defines the
    # value as "an array listing the Header Parameter names", forbids even
    # the empty array ("Producers MUST NOT use the empty list "[]""), and
    # requires that "crit" be "understood and processed by implementations".
    # RFC 7516 §5.2 step 5 makes the recipient verify that the values of
    # such fields "are also understood and supported". null is not an
    # array, so no valid message carries it.
    #
    # Without this check, null decodes to a nil slice, which reads exactly
    # like an absent "crit". The recipient would then skip the extension
    # check that a sender asks for by sending "crit" at all, so accepting
    # null turns a malformed value into a silent bypass. Nothing valid is
    # lost by rejecting it, which is why WithStrictHeaderRules(false) does
    # not bring the old acceptance back.
    reject_null: true
  - name: ephemeralPublicKey
    type: jwk.Key
    direct_storage: true
    json: epk
  - name: jwk
    exported_name: JWK
    getter: JWK
    type: jwk.Key
    direct_storage: true
  - name: jwkSetURL
    unexported_name: jwkSetURL
    exported_name: JWKSetURL
    getter: JWKSetURL
    json: jku
  - name: keyID
    json: kid
  - name: pskID
    exported_name: PSKID
    getter: PSKID
    type: "[]byte"
    json: psk_id
  - name: typ
    exported_name: Type
    getter: Type
  - name: x509URL
    unexported_name: x509URL
    exported_name: X509URL
    getter: X509URL
    json: x5u
  - name: x509CertChain
    unexported_name: x509CertChain
    exported_name: X509CertChain
    getter: X509CertChain
    type: "*cert.Chain"
    json: x5c
  - name: x509CertThumbprint
    unexported_name: x509CertThumbprint
    getter:  X509CertThumbprint
    json: x5t
  - name: x509CertThumbprintS256
    unexported_name: x509CertThumbprintS256
    exported_name: X509CertThumbprintS256
    getter: X509CertThumbprintS256
    json: "x5t#S256"
