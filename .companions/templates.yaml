# Template manifest: maps template filenames to destination paths
# and declares which modules each template applies to.
#
# Scope rules:
#   skip: [list]  — applies to all modules except listed
#   only: [list]  — applies only to listed modules
#   (neither)     — applies to all modules
#   skip and only are mutually exclusive.

templates:
  dependabot.yml:
    dest: .github/dependabot.yml
    skip: [benchmarks]
  lint.yml:
    dest: .github/workflows/lint.yml
    skip: [benchmarks]
  golangci.yml:
    dest: .golangci.yml
    skip: [benchmarks, examples]
  ci.yml:
    dest: .github/workflows/ci.yml
    skip: [benchmarks]
  assign-issue.yml:
    dest: .github/workflows/assign-issue.yml
  assign-pr.yml:
    dest: .github/workflows/assign-pr.yml
  auto-assign-pr.yml:
    dest: .github/auto-assign-pr.yml
  fuzz.yml:
    dest: .github/workflows/fuzz.yml
    skip: [benchmarks, examples, jwkfetch, jwxmigrate, x448]
  fuzz-pr.yml:
    dest: .github/workflows/fuzz-pr.yml
    skip: [benchmarks, examples, jwkfetch, jwxmigrate, x448]
