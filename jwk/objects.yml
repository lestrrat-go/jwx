std_fields:
  - name: keyUsage
    json: use
    comment: https://tools.ietf.org/html/rfc7517#section-4.2
    is_std: true
  - name: keyOps
    type: KeyOperationList
    json: key_ops
    hasAccept: true
    is_std: true
    comment: https://tools.ietf.org/html/rfc7517#section-4.3
  - name: algorithm
    json: alg
    is_std: true
    comment: https://tools.ietf.org/html/rfc7517#section-4.4
    type: jwa.KeyAlgorithm
  - name: keyID
    json: kid
    is_std: true
    comment: https://tools.ietf.org/html/rfc7515#section-4.1.4
  - name: x509URL
    getter: X509URL
    unexported_name: x509URL
    exported_name: X509URL
    json: x5u
    is_std: true
    comment: https://tools.ietf.org/html/rfc7515#section-4.1.5
  - name: x509CertChain
    getter: X509CertChain
    getter_return_value: "*cert.Chain"
    type: "*cert.Chain"
    json: x5c
    is_std: true
    noDeref: true
    comment: https://tools.ietf.org/html/rfc7515#section-4.1.6
  - name: x509CertThumbprint
    getter: X509CertThumbprint
    json: x5t
    is_std: true
    comment: https://tools.ietf.org/html/rfc7515#section-4.1.7
  - name: x509CertThumbprintS256
    getter:  X509CertThumbprintS256
    json: "x5t#S256"
    is_std: true
    comment: https://tools.ietf.org/html/rfc7515#section-4.1.8

key_types:
  - filename: rsa_gen.go
    prefix: RSA
    key_type: jwa.RSA()
    objects:
      - name: publicKey
        raw_key_type: "*rsa.PublicKey"
        fields:
          - name: n
            type: "[]byte"
            required: true
          - name: e
            type: "[]byte"
            required: true
      - name: privateKey
        raw_key_type: "*rsa.PrivateKey"
        fields:
          - name: d
            type: "[]byte"
            required: true
          - name: p
            type: "[]byte"
          - name: q
            type: "[]byte"
          - name: dp
            getter: DP
            exported_name: DP
            type: "[]byte"
          - name: dq
            getter: DQ
            exported_name: DQ
            type: "[]byte"
          - name: qi
            getter: QI
            exported_name: QI
            type: "[]byte"
          - name: n
            type: "[]byte"
            required: true
          - name: e
            type: "[]byte"
            required: true
  - filename: ecdsa_gen.go
    prefix: ECDSA
    key_type: jwa.EC()
    objects:
      - name: publicKey
        raw_key_type: "*ecdsa.PublicKey"
        fields:
          - name: x
            type: "[]byte"
            required: true
          - name: y
            type: "[]byte"
            required: true
          - name: crv
            getter: Crv
            type: jwa.EllipticCurveAlgorithm
            required: true
      - name: privateKey
        raw_key_type: "*ecdsa.PrivateKey"
        fields:
          - name: d
            type: "[]byte"
            required: true
          - name: x
            type: "[]byte"
            required: true
          - name: y
            type: "[]byte"
            required: true
          - name: crv
            getter: Crv
            type: jwa.EllipticCurveAlgorithm
            required: true
  - filename: symmetric_gen.go
    prefix: Symmetric
    key_type:  jwa.OctetSeq()
    objects:
      - name: symmetricKey
        interface: SymmetricKey
        struct_name: symmetricKey
        raw_key_type: "[]byte"
        fields:
          - name: octets
            type: "[]byte"
            json: k
            required: true
  - filename: okp_gen.go
    prefix: OKP
    key_type: jwa.OKP()
    objects:
      - name: publicKey
        raw_key_type: "interface{}"
        fields:
          - name: x
            type: "[]byte"
            required: true
          - name: crv
            getter: Crv
            type: jwa.EllipticCurveAlgorithm
            required: true
      - name: privateKey
        raw_key_type: "interface{}"
        fields:
          - name: x
            type: "[]byte"
            required: true
          - name: d
            type: "[]byte"
            required: true
          - name: crv
            getter: Crv
            type: jwa.EllipticCurveAlgorithm
            required: true
  - filename: akp_gen.go
    prefix: AKP
    key_type: jwa.AKP()
    objects:
      - name: publicKey
        comment: |
          AKPPublicKey represents the public portion of an Algorithm Key Pair (AKP) JWK,
          used by post-quantum algorithms such as ML-KEM (FIPS 203) and ML-DSA (FIPS 204).
        raw_key_type: "interface{}"
        fields:
          - name: pub
            type: "[]byte"
            required: true
      - name: privateKey
        comment: |
          AKPPrivateKey represents the private portion of an Algorithm Key Pair (AKP) JWK,
          used by post-quantum algorithms such as ML-KEM (FIPS 203) and ML-DSA (FIPS 204).

          INTEROPERABILITY WARNING: ML-KEM PRIVATE KEY ROUND-TRIP LIMITATION

          FIPS 203 defines the ML-KEM private key seed as 64 bytes in the "d || z" form,
          where d (32 bytes) generates the key pair and z (32 bytes) is the implicit
          rejection seed used during decapsulation. However, draft-ietf-jose-pqc-kem
          (https://datatracker.ietf.org/doc/draft-ietf-jose-pqc-kem/) mandates that
          the "priv" field contain only d (32 bytes). Go's crypto/mlkem
          package requires the full 64-byte seed to reconstruct a decapsulation key.

          Because the draft limits "priv" to 32 bytes, the z component is lost when a
          private key is exported to JWK. Re-importing will produce a decapsulation key
          with a randomly generated z. This key is functionally equivalent for all normal
          operations — z only affects implicit rejection (the fake shared secret returned
          for tampered ciphertexts) and does not change decapsulation of valid ciphertexts.

          This means JWK round-trips do NOT preserve bitwise key identity. If the draft
          is revised to accommodate the full 64-byte seed, this limitation will be
          resolved.
        raw_key_type: "interface{}"
        fields:
          - name: pub
            type: "[]byte"
            required: true
          - name: priv
            type: "[]byte"
            required: true
